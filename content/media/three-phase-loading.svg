<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Three Phase Progressive Loading Waterfall">
  <rect width="800" height="440" rx="12" fill="#0f141e"/>
  <text x="32" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AEM EDGE DELIVERY · EAGER → LAZY → DELAYED WATERFALL</text>

  <!-- Timeline axis -->
  <line x1="190" y1="74" x2="760" y2="74" stroke="#334155" stroke-width="1.5"/>
  <text x="190" y="66" fill="#94a3b8" font-family="monospace" font-size="11">0 ms</text>
  <text x="340" y="66" fill="#94a3b8" font-family="monospace" font-size="11">300 ms (LCP)</text>
  <text x="530" y="66" fill="#94a3b8" font-family="monospace" font-size="11">900 ms</text>
  <text x="690" y="66" fill="#94a3b8" font-family="monospace" font-size="11">3000 ms+</text>

  <!-- Phase 1 -->
  <text x="32" y="128" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Phase 1 · Eager</text>
  <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Blocks LCP only</text>
  <rect x="190" y="102" width="180" height="32" rx="6" fill="#12805c"/>
  <text x="204" y="123" fill="#ffffff" font-family="monospace" font-size="12">HTML + styles.css</text>
  <rect x="230" y="142" width="160" height="32" rx="6" fill="#059669"/>
  <text x="244" y="163" fill="#ffffff" font-family="monospace" font-size="12">Hero Block + LCP Img</text>

  <!-- Phase 2 -->
  <text x="32" y="238" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Phase 2 · Lazy</text>
  <text x="32" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Post-LCP interactive</text>
  <rect x="374" y="212" width="180" height="32" rx="6" fill="#1473e6"/>
  <text x="388" y="233" fill="#ffffff" font-family="monospace" font-size="12">Header + Footer + Fonts</text>
  <rect x="404" y="252" width="204" height="32" rx="6" fill="#2563eb"/>
  <text x="418" y="273" fill="#ffffff" font-family="monospace" font-size="12">Cards, Tabs, Catalog JSON</text>

  <!-- Phase 3 -->
  <text x="32" y="348" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Phase 3 · Delayed</text>
  <text x="32" y="368" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Zero LCP impact</text>
  <rect x="618" y="324" width="142" height="46" rx="6" fill="#b45309"/>
  <text x="632" y="346" fill="#ffffff" font-family="monospace" font-size="12">delayed.js</text>
  <text x="632" y="362" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11">RUM, Martech, Tagging</text>

  <!-- LCP marker line -->
  <line x1="390" y1="80" x2="390" y2="404" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="322" y="394" width="138" height="26" rx="4" fill="#12805c"/>
  <text x="391" y="411" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">LCP PAINTED</text>
</svg>
