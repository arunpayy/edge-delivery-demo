  <text x="582" y="96" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">3. MULTI-BRAND LIVE</text>
  <text x="582" y="120" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1 Codebase → N Brands</text>

  <rect x="582" y="138" width="170" height="46" rx="8" fill="#fafafa"/>
  <rect x="592" y="150" width="10" height="22" rx="3" fill="#eb1000"/>
  <text x="610" y="160" fill="#131720" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Adobe Editorial</text>
  <text x="610" y="175" fill="#4a5568" font-family="monospace" font-size="10">#eb1000 · 6px radius</text>

  <rect x="582" y="194" width="170" height="46" rx="4" fill="#f7f4ee"/>
  <rect x="592" y="206" width="10" height="22" rx="1" fill="#14532d"/>
  <text x="610" y="216" fill="#1c1917" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Nordic Luxury</text>
  <text x="610" y="231" fill="#57534e" font-family="monospace" font-size="10">#14532d · 2px sharp</text>

  <rect x="582" y="250" width="170" height="46" rx="12" fill="#f3f6fb"/>
  <rect x="592" y="262" width="10" height="22" rx="5" fill="#2563eb"/>
  <text x="610" y="272" fill="#0b1220" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Fintech Midnight</text>
  <text x="610" y="287" fill="#42526e" font-family="monospace" font-size="10">#2563eb · 12px soft</text>

  <!-- Bottom Guarantee Bar -->
  <rect x="32" y="344" width="736" height="104" rx="12" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="52" y="372" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">WHY DESIGN DIRECTORS &amp; EXECUTIVES ALIGN ON EDGE DELIVERY</text>

  <rect x="52" y="388" width="218" height="44" rx="8" fill="#12805c" fill-opacity="0.18" stroke="#10b981"/>
  <text x="66" y="414" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">CLS ~0.001 · Zero Jank</text>

  <rect x="291" y="388" width="218" height="44" rx="8" fill="#1473e6" fill-opacity="0.18" stroke="#3b82f6"/>
  <text x="305" y="414" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="700">Per-PR Visual Review URLs</text>

  <rect x="530" y="388" width="218" height="44" rx="8" fill="#eb1000" fill-opacity="0.2" stroke="#eb1000"/>
  <text x="544" y="414" fill="#ffb4ae" font-family="monospace" font-size="11" font-weight="700">Media Bus WebP/AVIF</text>
</svg>
